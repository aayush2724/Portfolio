<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=block">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0a0a0b;color:#f4f4f5;font-family:"Clash Display",sans-serif}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:60px 60px;background-position:-1px -1px}
  .bloom{position:absolute;inset:0;background:radial-gradient(55% 60% at 88% 8%,rgba(212,255,63,.16),transparent 70%),radial-gradient(45% 50% at 5% 100%,rgba(212,255,63,.07),transparent 70%)}
  .fog{position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(10,10,11,.6) 100%)}
  .wrap{position:absolute;inset:0;padding:56px 72px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;justify-content:space-between;align-items:center}
  .logo{font-weight:700;font-size:38px;letter-spacing:-.02em}
  .logo b{color:#d4ff3f;font-weight:700}
  .url{font-family:"JetBrains Mono",monospace;font-size:20px;color:#8b8b93}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:19px;letter-spacing:.34em;color:#d4ff3f;margin-bottom:22px}
  h1{margin:0;font-weight:600;text-transform:uppercase;font-size:168px;line-height:.82;letter-spacing:-.02em}
  h1 span{display:block}
  h1 .accent{color:#d4ff3f}
  .bottom{display:flex;justify-content:space-between;align-items:flex-end}
  .term{font-family:"JetBrains Mono",monospace;font-size:21px;color:#8b8b93;line-height:1.6}
  .term .p{color:#d4ff3f}
  .term .out{color:#f4f4f5}
  .pill{display:flex;gap:10px}
  .pill span{font-family:"JetBrains Mono",monospace;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#d4ff3f;border:1px solid rgba(212,255,63,.28);background:rgba(212,255,63,.06);border-radius:999px;padding:9px 16px}
</style></head>
<body>
<div class="grid"></div><div class="bloom"></div><div class="fog"></div>
<div class="wrap">
  <div class="top"><div class="logo">Aayush<b>.</b></div><div class="url">aayush-2724.vercel.app</div></div>
  <div>
    <div class="eyebrow">CS STUDENT · FULL-STACK DEVELOPER</div>
    <h1><span>Aayush</span><span class="accent">Kumar</span></h1>
  </div>
  <div class="bottom">
    <div class="term"><span class="p">➜</span> ~ ./launch --status<br><span class="out">🚀 open to internships &amp; collaboration</span></div>
    <div class="pill"><span>React</span><span>Node.js</span><span>Python</span><span>C++</span><span>LLMs · RAG</span></div>
  </div>
</div>
</body></html>
