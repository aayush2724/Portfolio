[project]
name = "portfolio-intelligence-backend"
version = "0.1.0"
description = "Portfolio Intelligence Agent — knowledge base, visitor assistant and GitHub intelligence for aayush-2724.vercel.app"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "structlog>=24.1",
  "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
# S101: asserts are how tests assert. B008: FastAPI's Depends()/Query() in defaults is the framework idiom.
# UP042: `(str, Enum)` stays so SQLAlchemy/Pydantic see plain string enums.
ignore = ["S101", "B008", "UP042"]
per-file-ignores = { "tests/*" = ["S105", "S106", "S603", "E501"], "alembic/*" = ["E501", "UP", "I001"], "app/assistant/prompts.py" = ["E501"], "app/assistant/profile.py" = ["E501"], "app/assistant/router.py" = ["E501"] }
